<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="96" cy="96" r="96" fill="#1B2A41"/>
  
  <!-- Borde dorado -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="#C5A880" stroke-width="4"/>
  
  <!-- Icono de notaría -->
  <g transform="translate(96, 96)">
    <!-- Balanza de justicia -->
    <circle cx="0" cy="0" r="40" fill="#C5A880" opacity="0.9"/>
    
    <!-- Base de la balanza -->
    <rect x="-4" y="20" width="8" height="30" fill="#FFFFFF"/>
    
    <!-- Brazo de la balanza -->
    <rect x="-25" y="15" width="50" height="6" fill="#FFFFFF"/>
    
    <!-- Platillos -->
    <ellipse cx="-20" cy="25" rx="12" ry="4" fill="#FFFFFF"/>
    <ellipse cx="20" cy="25" rx="12" ry="4" fill="#FFFFFF"/>
    
    <!-- Cadenas -->
    <line x1="-20" y1="25" x2="-20" y2="15" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="15" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <!-- Texto -->
  <text x="96" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#C5A880">
    NOTARÍA
  </text>
</svg> 