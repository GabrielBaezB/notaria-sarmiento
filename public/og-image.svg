<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="1200" height="630" fill="#1B2A41"/>
  
  <!-- Patrón de fondo -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3F5F" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo/Texto principal -->
  <g transform="translate(100, 150)">
    <!-- Icono de notaría -->
    <circle cx="80" cy="80" r="60" fill="#C5A880" opacity="0.9"/>
    <text x="80" y="95" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#1B2A41">⚖️</text>
    
    <!-- Título principal -->
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
      Notaría Sarmiento Moreno
    </text>
    
    <!-- Subtítulo -->
    <text x="200" y="100" font-family="Arial, sans-serif" font-size="24" fill="#C5A880">
      Valparaíso, Chile
    </text>
    
    <!-- Servicios -->
    <text x="200" y="140" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.8">
      Escrituras • Poderes • Autorizaciones • Compraventa
    </text>
  </g>
  
  <!-- Información de contacto -->
  <g transform="translate(100, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#C5A880">
      📍 Chacabuco 2843, Valparaíso
    </text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" fill="#C5A880">
      📞 +56 32 2256652
    </text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="20" fill="#C5A880">
      🌐 notariasarmiento.cl
    </text>
  </g>
  
  <!-- Elemento decorativo -->
  <g transform="translate(900, 200)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#C5A880" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#C5A880" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#C5A880" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Marca de agua -->
  <text x="1100" y="610" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5" text-anchor="end">
    notariasarmiento.cl
  </text>
</svg> 