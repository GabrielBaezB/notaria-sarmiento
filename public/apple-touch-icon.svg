<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con esquinas redondeadas -->
  <rect x="10" y="10" width="160" height="160" rx="20" fill="#1B2A41"/>
  
  <!-- Borde dorado -->
  <rect x="8" y="8" width="164" height="164" rx="22" fill="none" stroke="#C5A880" stroke-width="4"/>
  
  <!-- Icono de notaría -->
  <g transform="translate(90, 90)">
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="50" fill="#C5A880" opacity="0.9"/>
    
    <!-- Balanza de justicia -->
    <!-- Base -->
    <rect x="-4" y="20" width="8" height="30" fill="#FFFFFF"/>
    
    <!-- Brazo principal -->
    <rect x="-25" y="15" width="50" height="6" fill="#FFFFFF"/>
    
    <!-- Platillos -->
    <ellipse cx="-20" cy="25" rx="10" ry="4" fill="#FFFFFF"/>
    <ellipse cx="20" cy="25" rx="10" ry="4" fill="#FFFFFF"/>
    
    <!-- Cadenas -->
    <line x1="-20" y1="25" x2="-20" y2="15" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="15" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <!-- Texto -->
  <text x="90" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#C5A880">
    NOTARÍA
  </text>
</svg> 