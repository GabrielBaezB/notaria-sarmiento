<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="256" cy="256" r="256" fill="#1B2A41"/>
  
  <!-- Borde dorado -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#C5A880" stroke-width="8"/>
  
  <!-- Patrón de fondo sutil -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3F5F" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <circle cx="256" cy="256" r="220" fill="url(#grid)"/>
  
  <!-- Icono de notaría -->
  <g transform="translate(256, 256)">
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="100" fill="#C5A880" opacity="0.9"/>
    
    <!-- Balanza de justicia -->
    <!-- Base -->
    <rect x="-8" y="40" width="16" height="60" fill="#FFFFFF"/>
    
    <!-- Brazo principal -->
    <rect x="-50" y="30" width="100" height="12" fill="#FFFFFF"/>
    
    <!-- Platillos -->
    <ellipse cx="-40" cy="50" rx="20" ry="8" fill="#FFFFFF"/>
    <ellipse cx="40" cy="50" rx="20" ry="8" fill="#FFFFFF"/>
    
    <!-- Cadenas -->
    <line x1="-40" y1="50" x2="-40" y2="30" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="40" y1="50" x2="40" y2="30" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Elementos decorativos en los platillos -->
    <circle cx="-40" cy="45" r="3" fill="#1B2A41"/>
    <circle cx="40" cy="45" r="3" fill="#1B2A41"/>
  </g>
  
  <!-- Texto -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#C5A880">
    NOTARÍA
  </text>
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF" opacity="0.8">
    SARMIENTO MORENO
  </text>
</svg> 